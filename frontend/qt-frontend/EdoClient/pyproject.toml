[project]
name = "edo-client"
version = "0.1.0"
description = "Energy Data Orchestrator - Qt Desktop Client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyqt6>=6.5.0",
    "pyqt6-sip>=13.12.0",
    "qasync>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
edo-client = "edo_client.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edo_client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
