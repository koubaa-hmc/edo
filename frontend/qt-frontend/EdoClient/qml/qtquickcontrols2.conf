[Controls]
Style=iOS

[Basic]
# Custom button styling
Button.background.color=#ffffff
Button.background.border.color=#cccccc
Button.background.border.width=1
Button.background.radius=4
Button.padding=8

Button.content.color=#1a1a1a
Button.content.font.pixelSize=14

# Hover state
Button.hover.background.color=#f0f0f0

# Pressed state
Button.pressed.background.color=#e0e0e0

# Disabled state
Button.disabled.background.color=#f5f5f5
Button.disabled.content.color=#999999
